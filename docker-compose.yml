version: "3.8"

services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8002
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://postgres:jRaETciQWBgyBRWTYezlyVYdQjhlJcDG@centerbeam.proxy.rlwy.net:30764/railway
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=railway
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=jRaETciQWBgyBRWTYezlyVYdQjhlJcDG

volumes:
  postgres_data:
